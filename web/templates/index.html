<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고시 통합 분석 시스템</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Pretendard', 'Malgun Gothic', sans-serif; background: #f5f6fa; color: #333; }

    header {
      background: #1a4c8b;
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 1.2rem; }
    header .sub { font-size: 0.8rem; opacity: 0.75; margin-top: 2px; }

    .toolbar {
      background: #fff;
      border-bottom: 1px solid #ddd;
      padding: 10px 24px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .toolbar label { font-size: 0.82rem; color: #666; }
    .toolbar select, .toolbar input[type=date], .toolbar input[type=text] {
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 5px 9px;
      font-size: 0.88rem;
      font-family: inherit;
    }
    .toolbar input[type=text] { width: 180px; }
    .btn {
      border: none;
      border-radius: 4px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 0.88rem;
      font-family: inherit;
    }
    .btn-primary { background: #1a4c8b; color: #fff; }
    .btn-primary:hover { background: #15397a; }
    .btn-success { background: #197a4b; color: #fff; }
    .btn-success:hover { background: #145e39; }
    .btn-warn { background: #b35c00; color: #fff; }
    .btn-warn:hover { background: #8c4800; }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .sep { width: 1px; height: 24px; background: #ddd; }
    .total-badge {
      margin-left: auto;
      background: #e8f0fe;
      color: #1a4c8b;
      border-radius: 12px;
      padding: 3px 10px;
      font-size: 0.8rem;
      font-weight: bold;
    }

    .layout { display: flex; height: calc(100vh - 105px); overflow: hidden; }

    /* 좌측 목록 */
    .list-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .table-wrap { flex: 1; overflow-y: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }
    thead { background: #1a4c8b; color: #fff; position: sticky; top: 0; z-index: 1; }
    th, td { padding: 9px 12px; font-size: 0.85rem; text-align: left; }
    th { font-weight: 600; }
    tbody tr { border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: background 0.1s; }
    tbody tr:hover { background: #f0f5ff; }
    tbody tr.selected { background: #ddeaff; }

    .source-tag {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 9px;
      font-size: 0.74rem;
      font-weight: bold;
      white-space: nowrap;
    }
    .tag-mohw { background: #e3f0ff; color: #1a4c8b; }
    .tag-hira { background: #e6f9f0; color: #197a4b; }
    .tag-category { background: #fff3e0; color: #b35c00; }
    .has-summary { color: #197a4b; font-weight: bold; font-size: 0.8rem; }
    .no-summary { color: #bbb; font-size: 0.8rem; }

    .pagination {
      display: flex;
      gap: 6px;
      justify-content: center;
      align-items: center;
      padding: 10px;
      background: #fff;
      border-top: 1px solid #eee;
    }
    .pagination button {
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 4px;
      padding: 4px 12px;
      cursor: pointer;
      font-size: 0.85rem;
      font-family: inherit;
    }
    .pagination button.active { background: #1a4c8b; color: #fff; border-color: #1a4c8b; }
    .pagination button:disabled { opacity: 0.4; cursor: default; }
    .pagination .page-info { font-size: 0.82rem; color: #666; }

    /* 우측 상세 */
    .detail-panel {
      width: 380px;
      min-width: 300px;
      border-left: 1px solid #ddd;
      background: #fff;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .detail-panel .placeholder {
      color: #aaa;
      font-size: 0.88rem;
      text-align: center;
      margin-top: 60px;
    }
    .detail-title { font-size: 1rem; font-weight: bold; line-height: 1.5; color: #1a1a1a; }
    .detail-meta { display: flex; flex-wrap: wrap; gap: 8px; }
    .detail-meta span {
      background: #f0f4f8;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.78rem;
      color: #555;
    }
    .detail-url a {
      color: #1a4c8b;
      font-size: 0.82rem;
      text-decoration: none;
    }
    .detail-url a:hover { text-decoration: underline; }
    .section-label {
      font-size: 0.8rem;
      font-weight: bold;
      color: #1a4c8b;
      border-bottom: 1px solid #e0e8f5;
      padding-bottom: 4px;
    }
    .summary-box {
      background: #f8fafb;
      border-left: 3px solid #1a4c8b;
      padding: 12px 14px;
      border-radius: 4px;
      font-size: 0.84rem;
      line-height: 1.75;
      white-space: pre-wrap;
      color: #333;
    }
    .no-summary-msg { color: #aaa; font-size: 0.82rem; font-style: italic; }
    .attach-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
    .attach-list li a {
      color: #1a4c8b;
      font-size: 0.82rem;
      text-decoration: none;
    }
    .attach-list li a:hover { text-decoration: underline; }

    /* 상태바 */
    .statusbar {
      background: #f0f4f8;
      border-top: 1px solid #ddd;
      padding: 4px 16px;
      font-size: 0.78rem;
      color: #555;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 26px;
    }
    .statusbar.error { color: #c0392b; background: #fff5f5; }
    .statusbar .spinner {
      width: 12px; height: 12px;
      border: 2px solid #ccc;
      border-top-color: #1a4c8b;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .statusbar.loading .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-row td { text-align: center; padding: 40px; color: #888; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>고시 통합 분석 시스템</h1>
    <div class="sub">보건복지부 · 건강보험심사평가원 | 2026-03-01 이후</div>
  </div>
</header>

<div class="toolbar">
  <label>출처</label>
  <select id="filter-source">
    <option value="">전체</option>
    <option value="mohw">보건복지부</option>
    <option value="hira">심사평가원</option>
  </select>

  <label>기준일</label>
  <input type="date" id="filter-date" value="2026-03-01">

  <input type="text" id="filter-keyword" placeholder="제목 검색...">
  <button class="btn btn-primary" onclick="loadPage(1)">검색</button>

  <div class="sep"></div>

  <button class="btn btn-success" id="btn-crawl" onclick="runTask('crawl')">크롤링 실행</button>
  <button class="btn btn-warn" id="btn-summarize" onclick="runTask('summarize')">요약 실행</button>

  <span class="total-badge" id="total-badge">총 0건</span>
</div>

<div class="layout">
  <!-- 목록 -->
  <div class="list-panel">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:70px">출처</th>
            <th style="width:75px">구분</th>
            <th>제목</th>
            <th style="width:90px">등록일</th>
            <th style="width:55px">요약</th>
          </tr>
        </thead>
        <tbody id="notice-tbody">
          <tr class="loading-row"><td colspan="5">데이터를 불러오는 중...</td></tr>
        </tbody>
      </table>
    </div>
    <div class="pagination" id="pagination"></div>
  </div>

  <!-- 상세 -->
  <div class="detail-panel" id="detail-panel">
    <div class="placeholder">← 고시를 클릭하면<br>상세 정보가 표시됩니다</div>
  </div>
</div>

<div class="statusbar" id="statusbar">
  <div class="spinner"></div>
  <span id="status-msg">준비됨</span>
</div>

<script>
let currentPage = 1;
const PAGE_SIZE = 50;

// ── 목록 로드 ──────────────────────────────────────────
async function loadPage(page) {
  currentPage = page;
  const source = document.getElementById('filter-source').value;
  const fromDate = document.getElementById('filter-date').value;
  const keyword = document.getElementById('filter-keyword').value.trim();

  const params = new URLSearchParams({
    page,
    page_size: PAGE_SIZE,
    from_date: fromDate,
  });
  if (source) params.set('source', source);

  const tbody = document.getElementById('notice-tbody');
  tbody.innerHTML = '<tr class="loading-row"><td colspan="5">불러오는 중...</td></tr>';
  setStatus('목록 로드 중...', 'loading');

  try {
    const res = await fetch('/api/notices?' + params);
    const data = await res.json();

    const notices = data.notices || [];
    const total = data.total || 0;
    const pages = data.pages || 1;

    document.getElementById('total-badge').textContent = `총 ${total}건`;

    // 키워드 클라이언트 필터
    const filtered = keyword
      ? notices.filter(n => n.title.includes(keyword))
      : notices;

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr class="loading-row"><td colspan="5">데이터가 없습니다</td></tr>';
    } else {
      tbody.innerHTML = filtered.map(n => `
        <tr onclick="openDetail(${n.id}, this)">
          <td><span class="source-tag tag-${n.source}">${n.source === 'mohw' ? '복지부' : '심평원'}</span></td>
          <td><span class="source-tag tag-category">${esc(n.category || '-')}</span></td>
          <td>${esc(n.title)}</td>
          <td>${n.posted_date}</td>
          <td class="${n.summary ? 'has-summary' : 'no-summary'}">${n.summary ? '완료' : '-'}</td>
        </tr>
      `).join('');
    }

    renderPagination(page, pages);
    setStatus(`총 ${total}건 · ${page}/${pages} 페이지`);
  } catch (e) {
    tbody.innerHTML = '<tr class="loading-row"><td colspan="5">오류: 서버에 연결할 수 없습니다</td></tr>';
    setStatus('서버 연결 오류', 'error');
  }
}

function renderPagination(page, pages) {
  const pg = document.getElementById('pagination');
  if (pages <= 1) { pg.innerHTML = ''; return; }

  let html = `<button onclick="loadPage(${page-1})" ${page<=1?'disabled':''}>◀ 이전</button>`;
  html += `<span class="page-info">${page} / ${pages}</span>`;
  html += `<button onclick="loadPage(${page+1})" ${page>=pages?'disabled':''}>다음 ▶</button>`;
  pg.innerHTML = html;
}

// ── 상세 보기 ──────────────────────────────────────────
async function openDetail(id, row) {
  // 선택 강조
  document.querySelectorAll('#notice-tbody tr').forEach(r => r.classList.remove('selected'));
  if (row) row.classList.add('selected');

  const panel = document.getElementById('detail-panel');
  panel.innerHTML = '<div class="placeholder">불러오는 중...</div>';

  try {
    const res = await fetch('/api/notices/' + id);
    const n = await res.json();
    renderDetail(n);
  } catch (e) {
    panel.innerHTML = '<div class="placeholder">상세 정보를 불러올 수 없습니다</div>';
  }
}

function renderDetail(n) {
  const sourceName = n.source === 'mohw' ? '보건복지부' : '건강보험심사평가원';
  const atts = n.attachments || [];

  const attachHtml = atts.length
    ? `<ul class="attach-list">${atts.map(a =>
        `<li><a href="${a.download_url}" target="_blank">📎 ${esc(a.filename)}</a></li>`
      ).join('')}</ul>`
    : '<span class="no-summary-msg">첨부파일 없음</span>';

  document.getElementById('detail-panel').innerHTML = `
    <div class="detail-title">${esc(n.title)}</div>

    <div class="detail-meta">
      <span>${sourceName}</span>
      ${n.category ? `<span>${esc(n.category)}</span>` : ''}
      <span>📅 ${n.posted_date}</span>
      ${n.issued_no ? `<span>관보 ${esc(n.issued_no)}</span>` : ''}
    </div>

    ${n.detail_url ? `
      <div class="detail-url">
        <a href="${n.detail_url}" target="_blank">🔗 원문 보기 ↗</a>
      </div>` : ''}

    <div class="section-label">■ AI 요약</div>
    ${n.summary
      ? `<div class="summary-box">${esc(n.summary)}</div>`
      : `<span class="no-summary-msg">요약 없음 — [요약 실행] 버튼을 눌러 생성하세요</span>`
    }

    <div class="section-label">■ 첨부파일</div>
    ${attachHtml}
  `;
}

// ── 크롤링 / 요약 실행 ──────────────────────────────────
async function runTask(task) {
  const label = task === 'crawl' ? '크롤링' : 'AI 요약';
  const btnId = task === 'crawl' ? 'btn-crawl' : 'btn-summarize';
  const btn = document.getElementById(btnId);

  btn.disabled = true;
  document.getElementById('btn-crawl').disabled = true;
  document.getElementById('btn-summarize').disabled = true;
  setStatus(`${label} 실행 중... (완료까지 시간이 걸릴 수 있습니다)`, 'loading');

  try {
    const res = await fetch(`/api/run/${task}`, { method: 'POST' });
    const data = await res.json();

    if (data.exit_code === 0) {
      setStatus(`${label} 완료`);
      loadPage(1);
    } else {
      setStatus(`${label} 오류 (종료코드 ${data.exit_code})`, 'error');
      alert(`${label} 실패:\n\n${data.output?.slice(-500) || '출력 없음'}`);
    }
  } catch (e) {
    setStatus(`${label} 요청 실패`, 'error');
  } finally {
    document.getElementById('btn-crawl').disabled = false;
    document.getElementById('btn-summarize').disabled = false;
  }
}

// ── 유틸 ────────────────────────────────────────────────
function setStatus(msg, type = '') {
  const bar = document.getElementById('statusbar');
  bar.className = 'statusbar' + (type ? ' ' + type : '');
  document.getElementById('status-msg').textContent = msg;
}

function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// 엔터키로 검색
document.getElementById('filter-keyword').addEventListener('keydown', e => {
  if (e.key === 'Enter') loadPage(1);
});

// 초기 로드
loadPage(1);
</script>
</body>
</html>
